<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS Hub · Agent 配置</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --panel2:#fbfcfe; --well:#f8fafc; --well2:#f1f5f9;
  --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.14);
  --txt:#0f172a; --sub:#334155; --muted:#55657b; --faint:#64748b;
  --blue:#2563eb; --blue-hover:#1d4ed8; --blue-soft:#eef4ff; --blue-line:rgba(37,99,235,.35);
  --ok:#10b981; --ok-txt:#047857; --ok-soft:#ecfdf5; --ok-line:rgba(16,185,129,.35);
  --warn:#f59e0b; --warn-txt:#b45309; --warn-soft:#fffbeb; --warn-line:rgba(217,119,6,.35);
  --bad:#ef4444; --bad-txt:#dc2626; --bad-soft:#fef2f2; --bad-line:rgba(239,68,68,.3);
  --vio:#7c6cf0; --vio-txt:#6d5bd0; --vio-soft:#f3f1ff; --vio-line:rgba(124,108,240,.35);
  --weak:#94a3b8;
  --sh-sm:0 1px 2px rgba(15,23,42,.05);
  --sh-md:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --sh-lg:0 4px 12px rgba(15,23,42,.06),0 16px 48px rgba(15,23,42,.1);
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body.modal-open{overflow:hidden}
button{font-family:inherit;cursor:pointer}
select,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid rgba(37,99,235,.24);outline-offset:2px;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d4dce8;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶部全局栏 ===== */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:10px 20px;border-bottom:1px solid var(--line);
  background:#fff;
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.2px;color:var(--txt)}
.logo .lg-ico{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:9px}
.logo .lg-ico img{width:19px;height:19px;display:block}
.logo em{font-style:normal;color:var(--blue)}
.top-sep{width:1px;height:22px;background:var(--line2)}
.quick-entry{min-height:38px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.quick-entry span{color:var(--blue)}
.quick-entry:hover,.quick-entry.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue)}
.build-pill{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;
  padding:4px 11px;border-radius:999px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--blue);font-weight:600;
}
.draft-badge{
  font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer;border:none;
  border:1px solid var(--warn-line);color:var(--warn-txt);background:var(--warn-soft);
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.18)}50%{box-shadow:0 0 0 4px rgba(245,158,11,.1)}}
.main-tabs{display:flex;gap:2px;margin-left:auto;background:var(--well2);border-radius:10px;padding:3px}
.main-tabs button{
  border:none;background:transparent;color:var(--muted);font-size:13.5px;
  padding:7px 18px;border-radius:8px;transition:.15s;
}
.main-tabs button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:var(--sh-sm)}
.main-tabs button:not(.on):hover{color:var(--txt)}
.top-btn{
  background:#fff;border:1px solid var(--line2);color:var(--muted);
  border-radius:8px;padding:6px 13px;font-size:12.5px;transition:.15s;
}
.top-btn:hover{color:var(--blue);border-color:var(--blue-line)}

/* ===== 通用 ===== */
#view{max-width:1240px;margin:0 auto;padding:26px 24px 132px;animation:viewIn .22s ease}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:18px}
.page-title{font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.agent-name-display{position:relative;border:0;background:transparent;color:var(--txt);font:inherit;font-weight:inherit;letter-spacing:inherit;padding:1px 26px 1px 0;text-align:left}
.agent-name-display::after{content:"双击改名";position:absolute;left:100%;top:50%;transform:translate(-18px,-50%);font-size:10px;font-weight:400;color:transparent;white-space:nowrap;transition:.15s}
.agent-name-display:hover::after,.agent-name-display:focus-visible::after{color:var(--faint);transform:translate(0,-50%)}
.agent-name-input{width:min(420px,68vw);height:38px;border:1px solid var(--blue);border-radius:9px;background:#fff;color:var(--txt);font:inherit;font-weight:inherit;padding:4px 10px;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.page-sub{color:var(--muted);font-size:13px;margin-top:5px;max-width:860px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);margin-bottom:14px}
.crumbs a,.crumbs button{color:var(--muted);cursor:pointer;text-decoration:none}
.crumbs button{border:0;background:transparent;font:inherit;padding:0}
.crumbs a:hover,.crumbs button:hover{color:var(--blue)}
.crumbs .sep{color:#cbd5e1}
.crumbs b{color:var(--txt);font-weight:600}
.card{
  background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);
}
.btn{
  border:1px solid var(--line2);background:#fff;color:var(--sub);
  border-radius:9px;padding:8px 16px;font-size:13px;transition:.15s;
}
.btn:hover{border-color:var(--blue-line);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.pri:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.btn.warn-pri{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:500}
.btn.warn-pri:hover{background:#d97706;border-color:#d97706;color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:#fff}
.tag.cy{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.tag.ok{color:var(--ok-txt);border-color:var(--ok-line);background:var(--ok-soft)}
.tag.warn{color:var(--warn-txt);border-color:var(--warn-line);background:var(--warn-soft)}
.tag.bad{color:var(--bad-txt);border-color:var(--bad-line);background:var(--bad-soft)}
.tag.vio{color:var(--vio-txt);border-color:var(--vio-line);background:var(--vio-soft)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.note-bar{
  margin-top:14px;padding:11px 15px;border-radius:10px;font-size:12.5px;color:var(--muted);
  border:1px dashed var(--line2);background:#fff;
}
.note-bar b{color:var(--blue);font-weight:600}

/* ===== Agent 快速配置 ===== */
.config-mode-switch{width:min(620px,100%);display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--well2)}
.config-mode-switch button{min-width:0;min-height:44px;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-align:left}
.config-mode-switch button.on{background:#fff;box-shadow:var(--sh-sm);color:var(--txt)}
.config-mode-switch b,.config-mode-switch span{display:block}
.config-mode-switch b{font-size:12.5px}
.config-mode-switch span{margin-top:2px;font-size:12px;color:var(--faint)}
.quick-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.quick-page-head>button{min-height:44px;padding:7px 13px;border:1px solid var(--blue-line);border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:11.5px;white-space:nowrap}
.quick-profile-strip{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:13px;margin-bottom:14px;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(105deg,var(--blue-soft),#fff 62%);box-shadow:var(--sh-sm)}
.quick-dsh-avatar{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:1px solid var(--blue-line);border-radius:14px;background:#fff;box-shadow:var(--sh-sm)}.quick-dsh-avatar img{width:38px;height:38px;filter:drop-shadow(0 7px 10px rgba(37,99,235,.16))}
.quick-profile-strip small,.quick-profile-strip b,.quick-profile-strip p{display:block}
.quick-profile-strip small{color:var(--blue);font-size:12px}
.quick-profile-strip b{margin-top:2px;font-size:15px}
.quick-profile-strip p{max-width:720px;margin-top:3px;color:var(--muted);font-size:12px}
.quick-config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-config-card{min-width:0;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--sh-sm)}
.qc-head{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.qc-head>span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:10px;font-weight:700}
.qc-head h2{font-size:15px}
.qc-head p{margin-top:2px;color:var(--muted);font-size:12px;line-height:1.5}
.qc-rows{margin-top:13px;border-top:1px solid var(--line)}
.qc-rows>div{min-height:40px;display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.qc-rows span{color:var(--faint);font-size:12px}
.qc-rows b{min-width:0;color:var(--sub);font-size:11.5px;font-weight:550;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qc-quick-edit{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;margin-top:12px;padding:9px;border:1px solid var(--blue-line);border-radius:10px;background:var(--blue-soft)}
.qc-quick-edit label,.qc-quick-edit label>span{display:block;min-width:0}.qc-quick-edit label>span{margin-bottom:4px;color:var(--blue);font-size:12px;font-weight:600}.qc-quick-edit select{width:100%;height:42px;padding:0 30px 0 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--sub);font-size:12px}.qc-quick-edit>button{min-height:42px;padding:6px 10px;border:1px solid var(--blue);border-radius:8px;background:var(--blue);color:#fff;font-size:12px;white-space:nowrap}
.qc-pending-control{align-items:center;background:var(--warn-soft);border-color:var(--warn-line)}.qc-pending-control>div{min-width:0}.qc-pending-control span,.qc-pending-control b{display:block}.qc-pending-control span{color:var(--warn-txt);font-size:12px;font-weight:600}.qc-pending-control b{margin-top:3px;color:var(--sub);font-size:12px}.qc-pending-control>button:disabled{border-color:var(--line2);background:#fff;color:var(--muted);cursor:not-allowed}
.qc-actions{display:flex;gap:7px;margin-top:12px}
.qc-actions button{min-height:44px;flex:1;padding:6px 8px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--muted);font-size:12px;scroll-margin-bottom:108px}
.qc-actions button:first-child{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue)}
.qc-actions button:hover{border-color:var(--blue);color:var(--blue)}
.quick-workbench{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.quick-section-nav{display:grid;gap:7px;padding:7px;border:1px solid var(--line);border-radius:16px;background:var(--well2);box-shadow:var(--sh-sm)}
.quick-section-nav button{min-width:0;display:grid;grid-template-columns:32px minmax(0,1fr);gap:9px;padding:11px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);text-align:left}
.quick-section-nav button:hover{background:#fff;color:var(--txt)}
.quick-section-nav button.on{border-color:var(--blue-line);background:#fff;color:var(--txt);box-shadow:var(--sh-sm)}
.quick-section-nav button>span:first-child{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#fff;color:var(--faint);font-size:10px;font-weight:700}
.quick-section-nav button.on>span:first-child{background:var(--blue-soft);color:var(--blue)}
.quick-section-nav b,.quick-section-nav small,.quick-section-nav em{display:block;min-width:0}
.quick-section-nav b{font-size:13px}.quick-section-nav small{margin-top:1px;color:var(--muted);font-size:11px}.quick-section-nav em{margin-top:5px;color:var(--blue);font-size:10px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick-editor{min-width:0;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--sh-sm)}
.quick-editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.quick-editor-head>div{min-width:0}.quick-editor-head>div>span{color:var(--blue);font-size:11px;font-weight:650}.quick-editor-head h2{margin-top:2px;font-size:19px}.quick-editor-head p{max-width:720px;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.55}
.quick-editor-head>button,.quick-editor-actions button,.module-assistant-button,.unfold-head-actions button,.drawer-assistant-action{min-height:40px;padding:7px 11px;border:1px solid var(--blue-line);border-radius:9px;background:var(--blue-soft);color:var(--blue);font-size:11.5px;white-space:nowrap}
.quick-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.72fr);gap:13px;margin-top:16px}.quick-field{display:block;min-width:0}.quick-field.span-two{grid-column:1/-1}.quick-field>span{display:block;margin-bottom:5px;color:var(--sub);font-size:12px;font-weight:650}.quick-field select,.quick-field input,.quick-field textarea,.tool-search input{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--txt);font:inherit;font-size:12.5px;outline:0}.quick-field textarea{min-height:240px;resize:vertical;line-height:1.6}.quick-field select:focus,.quick-field input:focus,.quick-field textarea:focus,.tool-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.09)}.quick-field small{display:block;margin-top:5px;color:var(--faint);font-size:10.5px;line-height:1.45}
.quick-model-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.quick-model-facts span{min-width:0;padding:9px;border-radius:9px;background:var(--well)}.quick-model-facts small,.quick-model-facts b{display:block}.quick-model-facts small{color:var(--faint);font-size:10px}.quick-model-facts b{margin-top:2px;color:var(--sub);font-size:11px;overflow-wrap:anywhere}
.quick-editor-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.quick-editor-actions>span{max-width:720px;color:var(--muted);font-size:11px;line-height:1.5}.quick-editor-actions>button:last-child{border-color:var(--blue);background:var(--blue);color:#fff}.quick-editor-actions button:disabled,.quick-editor button:disabled{opacity:.48;cursor:not-allowed}
.context-mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:16px}.context-mode-grid button{min-height:112px;padding:13px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--sub);text-align:left}.context-mode-grid button:hover{border-color:var(--blue-line)}.context-mode-grid button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(37,99,235,.07)}.context-mode-grid b,.context-mode-grid span{display:block}.context-mode-grid b{font-size:13px}.context-mode-grid span{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}.context-prune{max-width:520px;margin-top:15px}
.prompt-source-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.prompt-source-strip span{padding:8px 9px;border-radius:9px;background:var(--well);color:var(--muted);font-size:10.5px}.prompt-source-strip b{display:block;color:var(--sub);font-size:11px}
.tool-search{display:block;margin-top:14px}.quick-tool-list{display:grid;gap:8px;max-height:540px;margin-top:10px;padding-right:3px;overflow-y:auto}.quick-tool-row{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.quick-tool-row:hover{border-color:var(--blue-line)}.quick-tool-main{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:9px}.quick-tool-main>div{min-width:0}.quick-tool-main b,.quick-tool-main small{display:block}.quick-tool-main b{font-size:12.5px}.quick-tool-main small{margin-top:1px;color:var(--faint);font:10.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;overflow-wrap:anywhere}.quick-tool-row>p{margin:7px 0 0 41px;color:var(--muted);font-size:11px}.quick-tool-actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:9px}.quick-tool-actions button{min-height:38px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--muted);font-size:11px}.quick-tool-actions button:hover{border-color:var(--blue-line);color:var(--blue)}.quick-tool-actions button.add{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue)}.quick-tool-actions button.remove{color:var(--bad-txt)}.quick-tools-empty{padding:28px;border:1px dashed var(--line2);border-radius:11px;text-align:center;color:var(--muted);font-size:12px}
.tool-inline-editor{margin-top:9px;padding:9px;border-radius:10px;background:var(--well)}.tool-inline-editor>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.tool-inline-editor label span{display:block;color:var(--faint);font-size:10px}.tool-inline-editor input{width:100%;min-height:38px;margin-top:3px;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--sub)}.tool-inline-editor>button{min-height:38px;margin-top:8px;padding:6px 9px;border:1px solid var(--blue-line);border-radius:8px;background:#fff;color:var(--blue);font-size:11px}
.module-assistant-button{margin-top:10px}.unfold-head-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}.unfold-head .unfold-head-actions .uh-count{margin:0}.drawer-assistant-action{width:100%;margin-top:10px}
[draggable="true"]{cursor:grab}[draggable="true"]:active{cursor:grabbing}.context-dragging .assistant-chatbar,.context-dragging .config-assistant{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12),0 18px 54px rgba(15,23,42,.16)}

/* ===== 能力配置 · 整机总览 ===== */
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0 0}
.legend span{display:flex;align-items:center;gap:7px}
.lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.stage-wrap{overflow-x:auto;padding:4px 0 2px}
.mecha-stage{position:relative;width:1000px;height:584px;margin:8px auto 0}
.link-svg{position:absolute;inset:0;pointer-events:none}
.link-svg path{fill:none;stroke-width:1.4;opacity:.9}
.link-svg .lk-ok{stroke:#b9c8e2}
.link-svg .lk-warn{stroke:rgba(217,119,6,.5);stroke-dasharray:5 4}
.link-svg .lk-weak{stroke:#dde3ee}
.link-svg .lk-upd{stroke:rgba(37,99,235,.5)}
.link-svg circle{fill:#fff;stroke-width:2}
.anchor-ok{stroke:var(--ok)}
.anchor-warn{stroke:var(--warn)}
.anchor-weak{stroke:var(--weak)}
.anchor-upd{stroke:var(--blue)}

/* ===== 中央机体形象 ===== */
.mascot-holder{position:absolute;left:320px;top:62px;width:360px;height:472px}
.core-avatar-wrap{position:relative;width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center}
.core-avatar{position:relative;width:100%;height:424px;border:0;background:transparent;border-radius:34px;display:flex;align-items:center;justify-content:center;color:var(--txt);user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.core-avatar:hover{background:radial-gradient(ellipse at 50% 48%,rgba(219,234,254,.4),transparent 68%)}
.core-avatar.logo-mode::before{content:"";position:absolute;left:50%;top:49%;width:276px;height:276px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0,#eef5ff 48%,rgba(238,244,255,.2) 68%,transparent 72%);box-shadow:0 28px 62px rgba(37,99,235,.12)}
.dsh-orbit{position:relative;z-index:2;width:266px;height:266px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(37,99,235,.18);border-radius:50%;background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 12px rgba(238,244,255,.72),0 16px 42px rgba(37,99,235,.09)}
.dsh-orbit::before,.dsh-orbit::after{content:"";position:absolute;border:1px solid rgba(37,99,235,.18);border-radius:50%;pointer-events:none}
.dsh-orbit::before{inset:-22px;border-style:dashed;animation:orbitSpin 18s linear infinite}
.dsh-orbit::after{left:50%;top:-30px;width:9px;height:9px;margin-left:-5px;background:#fff;border-color:var(--blue);box-shadow:0 0 0 5px rgba(37,99,235,.08)}
.dsh-orbit-ring{position:absolute;inset:32px;border:1px solid rgba(37,99,235,.12);border-radius:50%}
.dsh-orbit-ring::before,.dsh-orbit-ring::after{content:"";position:absolute;background:rgba(37,99,235,.14)}
.dsh-orbit-ring::before{left:50%;top:-34px;bottom:-34px;width:1px}
.dsh-orbit-ring::after{top:50%;left:-34px;right:-34px;height:1px}
.dsh-core-logo{position:relative;z-index:2;width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(37,99,235,.17))}
.dsh-orbit b{position:relative;z-index:2;margin-top:12px;font-size:18px;letter-spacing:.2px}
.dsh-orbit small{position:relative;z-index:2;margin-top:1px;color:var(--blue);font-size:10px;letter-spacing:1.7px;text-transform:uppercase}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
.core-avatar.girl .mascot-img{width:100%;height:100%;object-position:center bottom}
.avatar-hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:10.5px;color:var(--faint);white-space:nowrap;pointer-events:none}
.mascot-slot{
  position:relative;overflow:visible;
  display:flex;align-items:center;justify-content:center;
  border:0;border-radius:28px;
  background:radial-gradient(ellipse at 50% 48%,rgba(219,234,254,.72) 0,rgba(224,231,255,.26) 48%,rgba(248,250,252,0) 74%);
}
.mascot-slot::after{
  content:"";position:absolute;left:20%;right:20%;bottom:4px;height:18px;pointer-events:none;
  border-radius:50%;background:rgba(96,165,250,.17);filter:blur(7px);
}
.mascot-img{
  position:relative;z-index:1;width:100%;height:100%;display:block;
  object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 14px 18px rgba(37,99,235,.16));
}
.mascot-slot.small{
  overflow:hidden;border:1px solid var(--line2);border-radius:12px;
  background:radial-gradient(ellipse at 50% 42%,#eef4ff 0,#f8faff 66%,#fff 100%);
  box-shadow:var(--sh-sm);
}
.mascot-slot.small::after{left:22%;right:22%;bottom:5px;height:10px;filter:blur(5px)}
.mascot-slot.small .mascot-img{
  object-position:center bottom;
  filter:drop-shadow(0 8px 10px rgba(37,99,235,.13));
}

.mod-card{
  position:absolute;width:272px;padding:15px 17px;cursor:pointer;
  background:#fff;
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);
  transition:transform .18s, box-shadow .18s, border-color .18s;
  text-align:left;color:inherit;font:inherit;
}
.mod-card:hover{transform:translateY(-3px);border-color:var(--blue-line);box-shadow:var(--sh-md)}
.mod-card.st-warn{border-color:var(--warn-line)}
.mod-card.st-warn:hover{border-color:var(--warn)}
.mod-card.st-weak{opacity:.62}
.mod-card.st-upd{border-color:var(--blue-line)}
.mod-card.st-upd:hover{border-color:var(--blue)}
.mod-head{display:flex;align-items:flex-start;gap:10px}
.mod-name{font-size:15px;font-weight:600}
.mod-en{font-size:10.5px;color:var(--faint);letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
.mod-dot{margin-left:auto;width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.mod-dot.ok{background:var(--ok)}
.mod-dot.warn{background:var(--warn)}
.mod-dot.weak{background:var(--weak)}
.mod-dot.upd{background:var(--blue);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.25)}50%{box-shadow:0 0 0 4px rgba(37,99,235,.12)}}
.mod-desc{color:var(--muted);font-size:12.5px;margin-top:8px}
.mod-sum{margin-top:10px;font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mod-cta{margin-top:10px;font-size:12px;color:var(--faint)}
.mod-card:hover .mod-cta{color:var(--blue)}

/* 角色卡 */
.attire{
  position:absolute;left:50%;transform:translateX(-50%);top:0;z-index:5;
  display:flex;align-items:center;gap:8px;padding:7px 14px;
  background:#fff;border:1px solid var(--vio-line);border-radius:999px;
  box-shadow:var(--sh-sm);
}
.attire .a-label{font-size:11px;color:var(--vio-txt);letter-spacing:1px}
.attire .a-name{font-size:13px;font-weight:600}
.attire .chip{font-size:11px;padding:1px 9px;border-radius:999px;border:1px solid var(--vio-line);color:var(--vio-txt);background:var(--vio-soft)}
.attire button{border:none;background:transparent;color:var(--faint);font-size:11.5px;text-decoration:underline;padding:0 2px}
.attire button:hover{color:var(--vio-txt)}

/* 身份抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:80;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:380px;z-index:81;
  background:#fff;border-left:1px solid var(--line);padding:22px;
  box-shadow:var(--sh-lg);
  animation:slideIn .22s ease;overflow-y:auto;
}
@keyframes slideIn{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.drawer .d-sub{font-size:12.5px;color:var(--muted);margin:6px 0 16px}
.id-card{padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff}
.id-card:hover{border-color:var(--vio-line)}
.id-card.on{border-color:var(--vio-line);background:var(--vio-soft)}
.id-card .id-name{font-weight:600;display:flex;align-items:center;gap:8px;font-size:13.5px}
.id-card .id-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.d-close{float:right;background:none;border:none;color:var(--faint);font-size:18px}
.d-close:hover{color:var(--txt)}

/* ===== 二级模块配置 ===== */
.cockpit{display:grid;grid-template-columns:212px 1fr;gap:22px;align-items:start}
.mini-mecha{position:sticky;top:76px;text-align:center}
.mini-mecha .mm-cap{font-size:11.5px;color:var(--faint);margin-top:10px}
.part-ind{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;box-shadow:var(--sh-sm);text-align:left}
.part-ind .pi{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.part-ind .pi:last-child{border-bottom:none}
.part-ind .pi.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.part-ind .pi .pi-dot{width:6px;height:6px;border-radius:50%;background:#cbd5e1;flex:none}
.part-ind .pi.on .pi-dot{background:var(--blue)}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slot-card{padding:16px 18px;position:relative;transition:border-color .18s, box-shadow .18s}
.slot-card.deep:hover{border-color:var(--blue-line);box-shadow:var(--sh-md)}
.slot-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot-head .s-name{font-size:15px;font-weight:600}
.slot-q{margin-top:9px;font-size:12.5px;color:var(--muted)}
.slot-q b{color:var(--faint);font-weight:500;display:block;font-size:11px;letter-spacing:.5px;margin-bottom:1px}
.slot-cur{margin-top:9px;font-size:12.5px;color:var(--sub)}
.slot-foot{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:12px}
.slot-foot .go{margin-left:auto;color:var(--blue);cursor:pointer;font-size:12.5px;font-weight:500}
.slot-list{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.slot-list .si{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 10px;background:var(--well);border:1px solid var(--line);border-radius:8px;color:var(--sub)}
.si-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.si-dot.off{background:var(--weak)}
.radio-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.radio-opt{
  padding:7px 12px;border:1px solid var(--line2);border-radius:9px;font-size:12.5px;cursor:pointer;
  color:var(--muted);transition:.15s;background:#fff;
}
.radio-opt:hover{border-color:var(--blue-line)}
.radio-opt.on{border-color:var(--blue-line);color:var(--blue);background:var(--blue-soft);font-weight:500}

/* ===== 模块配置 · 模块 → 能力 → 组件 ===== */
.config-shell{display:grid;grid-template-columns:182px minmax(0,1fr);gap:18px;align-items:start}
.module-rail{position:sticky;top:76px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm)}
.rail-label{font-size:11px;color:var(--faint);letter-spacing:.8px;padding:3px 8px 8px}
.module-switch{width:100%;display:flex;gap:10px;align-items:center;border:0;background:transparent;border-radius:10px;padding:10px 9px;text-align:left;color:var(--muted);transition:.15s}
.module-switch:hover{background:var(--well);color:var(--txt)}
.module-switch.on{background:var(--blue-soft);color:var(--blue)}
.module-switch .ms-ico{width:31px;height:31px;border-radius:9px;background:var(--well2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.module-switch.on .ms-ico{background:#fff;box-shadow:var(--sh-sm)}
.module-switch b{font-size:13px;font-weight:600;display:block}
.module-switch small{font-size:10.5px;color:var(--faint);display:block;margin-top:1px}
.rail-library{width:100%;margin-top:9px;padding:10px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--sub);text-align:left}
.rail-library:hover{border-color:var(--blue-line);color:var(--blue)}
.rail-library b{display:block;font-size:12.5px}
.rail-library small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}

.config-workbench{min-width:0}
.config-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:12px}
.config-intro .page-head{margin-bottom:0}
.path-guide{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--faint);padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;white-space:nowrap}
.path-guide b{color:var(--txt);font-weight:600}
.path-guide i{font-style:normal;color:#cbd5e1}
.map-board{position:relative;display:grid;grid-template-columns:144px 224px minmax(360px,1fr);gap:26px;min-height:540px;padding:20px;background:
  radial-gradient(circle at 1px 1px,rgba(100,116,139,.10) 1px,transparent 0) 0 0/22px 22px,#fff;
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);overflow:hidden}
.map-col-label{font-size:10.5px;letter-spacing:.9px;color:var(--faint);margin-bottom:10px;text-transform:uppercase}
.map-root-col,.ability-col,.component-col{position:relative;z-index:1;min-width:0}
.map-root-col{display:flex;flex-direction:column;justify-content:center}
.map-root{position:relative;padding:18px 14px;border:1px solid var(--blue-line);border-radius:14px;background:var(--blue-soft);box-shadow:0 8px 22px rgba(37,99,235,.08)}
.map-root::after{content:"";position:absolute;right:-27px;top:50%;width:26px;height:1px;background:#b8c7df}
.map-root .root-kicker{font-size:10.5px;letter-spacing:1px;color:var(--blue);text-transform:uppercase}
.map-root .root-name{font-size:20px;font-weight:650;margin-top:2px}
.map-root .root-desc{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55}
.map-root .root-count{font-size:11px;color:var(--blue);margin-top:10px}
.ability-col{padding-left:0}
.ability-col::before{content:"";position:absolute;left:-14px;top:39px;bottom:20px;width:1px;background:#d5deeb}
.ability-list{display:flex;flex-direction:column;gap:9px}
.ability-node{position:relative;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;text-align:left;color:var(--sub);transition:.16s;box-shadow:var(--sh-sm)}
.ability-node::before{content:"";position:absolute;left:-14px;top:50%;width:13px;height:1px;background:#d5deeb}
.ability-node:hover{border-color:var(--blue-line);transform:translateX(2px)}
.ability-node.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.06)}
.ability-node .an-top{display:flex;align-items:center;gap:8px}
.ability-node b{font-size:13.5px;font-weight:600}
.ability-node .an-count{margin-left:auto;font-size:10.5px;color:var(--faint)}
.ability-node p{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.ability-node.on p{color:#526984}

.component-panel{height:100%;border:1px solid var(--line);border-radius:14px;background:rgba(248,250,252,.92);overflow:hidden}
.component-head{padding:14px 15px 12px;border-bottom:1px solid var(--line);background:#fff}
.component-head .ch-path{font-size:10.5px;color:var(--faint);letter-spacing:.3px}
.component-head h3{font-size:15px;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.component-head p{font-size:12px;color:var(--muted);margin-top:4px}
.component-head .ch-help{margin-top:9px;font-size:11.5px;color:var(--blue);background:var(--blue-soft);padding:7px 9px;border-radius:8px}
.component-groups{padding:12px;max-height:432px;overflow-y:auto}
.component-group{margin-bottom:13px}
.component-group:last-child{margin-bottom:0}
.cg-title{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint);margin:0 3px 6px}
.cg-title span:last-child{margin-left:auto}
.component-row{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;color:var(--sub);transition:.15s}
.component-row:hover{border-color:var(--blue-line);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.type-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.type-ico.plugin{background:var(--blue-soft);color:var(--blue)}
.type-ico.skill{background:var(--vio-soft);color:var(--vio-txt)}
.type-ico.tool{background:var(--ok-soft);color:var(--ok-txt)}
.type-ico.prompt{background:var(--warn-soft);color:var(--warn-txt)}
.cr-name{font-size:12.5px;font-weight:600;color:var(--txt)}
.cr-tech{font-size:10.5px;color:var(--faint);font-family:ui-monospace,"SF Mono",Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cr-status{font-size:10.5px;color:var(--ok-txt);white-space:nowrap}
.cr-status.off{color:var(--faint)}
.add-component{width:100%;border:1px dashed var(--blue-line);border-radius:10px;padding:9px;background:transparent;color:var(--blue);font-size:12px}
.add-component:hover{background:var(--blue-soft)}

.comp-drawer-path{font-size:11px;color:var(--faint);margin:6px 0 14px;line-height:1.5}
.plain-explain{padding:12px 13px;background:var(--blue-soft);border-radius:10px;color:var(--sub);font-size:13px;margin-bottom:14px}
.detail-sec{padding:13px 0;border-top:1px solid var(--line)}
.detail-sec h4{font-size:11px;letter-spacing:.7px;color:var(--faint);margin-bottom:8px}
.detail-line{display:grid;grid-template-columns:88px 1fr;gap:8px;font-size:12px;margin-bottom:7px;color:var(--sub)}
.detail-line b{font-weight:500;color:var(--faint)}
.technical-entries summary{min-height:42px;display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--blue);font-size:11px;cursor:pointer}
.technical-entry-list{display:grid;gap:7px;margin-top:8px}
.technical-entry{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.te-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.te-head b{min-width:0;color:var(--sub);font-size:11px;overflow-wrap:anywhere}
.technical-entry>.mono{font-size:9.5px;overflow-wrap:anywhere}
.technical-entry>small{display:block;margin-top:5px;color:var(--faint);font-size:9.5px}
.te-config{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.te-config span{padding:2px 5px;border-radius:5px;background:var(--well);color:var(--muted);font-size:9px;overflow-wrap:anywhere}
.drawer-actions{display:flex;gap:8px;margin-top:15px}
.library-search{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;outline:none;margin:4px 0 12px}
.library-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.library-row{display:block;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#fff;color:var(--sub);text-align:left}
.library-row:hover{border-color:var(--blue-line);box-shadow:var(--sh-sm)}
.library-row .lr-top{display:flex;align-items:center;gap:8px}
.library-row .lr-name{font-weight:600;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.library-row .lr-path{display:block;font-size:11px;color:var(--muted);margin-top:5px}

/* ===== 运行观测 ===== */
.observe-kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.metric-card{padding:15px 16px}
.metric-card .m-label{font-size:11px;color:var(--faint)}
.metric-card .m-value{font-size:23px;font-weight:650;margin-top:2px;letter-spacing:-.5px}
.metric-card .m-note{font-size:11px;color:var(--muted);margin-top:2px}
.observe-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.run-list{overflow:hidden}
.run-list-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}
.run-list-head h3,.trend-card h3{font-size:13.5px}
.run-row{display:grid;grid-template-columns:minmax(0,1fr) 82px 74px 62px;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);font-size:12px}
.run-row:last-child{border-bottom:0}
.run-row .run-name{font-weight:600;color:var(--txt)}
.run-row .run-sub{font-size:10.5px;color:var(--faint);margin-top:2px}
.run-ok{color:var(--ok-txt)}
.run-warn{color:var(--warn-txt)}
.distribution-group{padding:14px 15px;border-bottom:1px solid var(--line)}
.distribution-group:last-child{border-bottom:0}
.distribution-group h4{margin-bottom:9px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.6px}
.distribution-row{display:grid;grid-template-columns:minmax(118px,1fr) minmax(130px,2fr) 38px;align-items:center;gap:12px;margin:9px 0}
.distribution-row>div b,.distribution-row>div span{display:block}
.distribution-row>div b{font-size:12px;color:var(--sub)}
.distribution-row>div span{font-size:9.5px;color:var(--faint)}
.distribution-track{height:8px;overflow:hidden;border-radius:999px;background:var(--well2)}
.distribution-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#60a5fa,#2563eb)}
.distribution-row strong{color:var(--blue);font-size:11px;text-align:right}
.trend-card{padding:15px}
.trend-bars{display:flex;align-items:flex-end;height:142px;gap:9px;padding:16px 4px 5px;border-bottom:1px solid var(--line)}
.trend-bar{flex:1;background:linear-gradient(180deg,#60a5fa,#2563eb);border-radius:5px 5px 0 0;min-height:8px;position:relative}
.trend-bar.zero{min-height:0}
.trend-bar.fail{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.trend-labels{display:flex;gap:9px;padding:6px 4px 0;color:var(--faint);font-size:9px;text-align:center}
.trend-labels span{flex:1}
.trend-data-list{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.trend-data-list span{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:7px;background:var(--well);color:var(--muted);font-size:10.5px}
.trend-data-list b{color:var(--sub);font-size:10.5px}

.snapshot-freshness{max-width:1000px;display:flex;align-items:flex-start;gap:9px;margin:0 auto 14px;padding:10px 12px;border:1px solid var(--warn-line);border-radius:11px;background:var(--warn-soft);color:var(--warn-txt);font-size:12px;line-height:1.5}
.snapshot-freshness b{flex:none}.snapshot-freshness span{color:var(--muted)}

/* ===== 真实配置快照 ===== */
.actual-head{max-width:1000px;margin:0 auto 2px}
.actual-facts{display:grid;grid-template-columns:1fr 1fr 1.4fr 1.1fr;gap:10px;margin-top:14px}
.actual-facts>span{display:flex;flex-direction:column;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--sh-sm);min-width:0}
.actual-facts b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actual-facts small{font-size:10.5px;color:var(--muted);margin-top:2px}
.wide-drawer{width:520px}
.library-counts{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 8px}
.library-counts span{font-size:10.5px;color:var(--muted);background:var(--well2);padding:3px 8px;border-radius:999px}
.compact-value{font-size:15px!important;line-height:1.35;overflow-wrap:anywhere;margin-top:8px!important}
.settings-facts{padding:18px}
.settings-facts h3{font-size:14px;margin-bottom:12px}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.settings-grid>div{display:flex;flex-direction:column;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--well)}
.settings-grid b{font-size:11px;color:var(--faint);font-weight:500}
.settings-grid span{font-size:13px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.simple-map{grid-template-columns:180px minmax(0,1fr)}
.simple-map .span-two{grid-column:2}
.honest-empty{max-width:800px;margin:28px auto;padding:36px;text-align:center}
.honest-empty .empty-mark{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--warn-soft);color:var(--warn-txt);font-size:25px}
.honest-empty h1,.honest-empty h2{font-size:18px}
.honest-empty>p{max-width:660px;margin:8px auto 20px;color:var(--muted);font-size:13px}
.empty-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.empty-grid span{padding:11px 12px;border-radius:9px;background:var(--ok-soft);color:var(--ok-txt);font-size:12px}
.empty-grid span.missing{background:var(--warn-soft);color:var(--warn-txt)}
.empty-grid b{margin-right:7px}
.empty-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.empty-actions button{min-height:40px;padding:7px 13px;border:1px solid var(--blue-line);border-radius:9px;background:#fff;color:var(--blue);font-size:11.5px}
.trial-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.trial-head>button{min-height:40px;padding:7px 12px;border:1px solid var(--blue-line);border-radius:9px;background:var(--blue-soft);color:var(--blue);font-size:11px}
.optimization-progress{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(420px,1.3fr);align-items:center;gap:20px;padding:15px 17px;margin-bottom:12px}
.optimization-progress>div:first-child span,.optimization-progress>div:first-child b{display:block}
.optimization-progress>div:first-child span{color:var(--blue);font-size:9.5px}
.optimization-progress>div:first-child b{margin-top:3px;font-size:12.5px}
.op-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.op-steps>span{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:12px;text-align:center}
.op-steps>span:not(:last-child)::after{content:"";position:absolute;left:62%;right:-38%;top:11px;height:1px;background:var(--line2)}
.op-steps i{position:relative;z-index:1;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:50%;background:#fff;font-size:9px;font-style:normal}
.op-steps .done i{border-color:var(--ok);background:var(--ok);color:#fff}.op-steps .on i{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.09)}
.op-steps .done b,.op-steps .on b{color:var(--sub)}
.trial-workbench{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}
.trial-section,.comparison-section,.adoption-section{padding:16px}
.trial-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.trial-section-head>div>span,.adoption-section>div>span{color:var(--blue);font-size:12px}
.trial-section-head h2,.adoption-section h2{margin-top:2px;font-size:14px}
.trial-diff{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin-top:14px}
.trial-diff>span{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--well)}
.trial-diff>span:last-child{border-color:var(--blue-line);background:var(--blue-soft)}
.trial-diff small,.trial-diff b{display:block}.trial-diff small{color:var(--faint);font-size:12px}.trial-diff b{margin-top:3px;font-size:12px;overflow-wrap:anywhere}.trial-diff i{color:var(--faint);font-style:normal}
.trial-section>p{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.55}
.trial-empty{min-height:110px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;margin-top:12px;padding:14px;border:1px dashed var(--line2);border-radius:11px;background:var(--panel2);color:var(--muted);font-size:11.5px}
.trial-empty button,.trial-primary{min-height:38px;margin-top:9px;padding:6px 10px;border:1px solid var(--blue-line);border-radius:8px;background:#fff;color:var(--blue);font-size:10.5px}
.test-case-list{display:grid;gap:7px;margin-top:12px}
.test-case-list article{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--well)}
.test-case-list article>span{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#fff;color:var(--blue);font-size:9px}
.test-case-list b{font-size:12px}.test-case-list p{margin-top:2px;color:var(--muted);font-size:12px;line-height:1.45}.test-case-list small{display:block;margin-top:4px;color:var(--faint);font-size:12px}
.trial-note{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--well);color:var(--muted);font-size:12px;line-height:1.5}
.acceptance-rule{margin-top:9px;padding:8px 10px;border:1px solid var(--blue-line);border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:12px}
.comparison-section{margin-top:12px}
.comparison-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.comparison-summary span{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--well);text-align:center}.comparison-summary span.bad{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad-txt)}
.comparison-summary small,.comparison-summary b{display:block}.comparison-summary small{color:var(--faint);font-size:12px}.comparison-summary b{margin-top:2px;font-size:17px}
.trial-running{display:flex;align-items:center;gap:9px;margin-top:14px;padding:15px;border:1px solid var(--blue-line);border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:11px}.trial-running i{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:breathe 1.2s infinite}
.regression-confirm{display:flex;align-items:center;gap:9px;margin-top:14px;padding:12px;border:1px solid var(--warn-line);border-radius:10px;background:var(--warn-soft)}.regression-confirm p{flex:1;color:var(--warn-txt);font-size:12px}.regression-confirm button{min-height:40px;padding:5px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--muted);font-size:12px}.regression-confirm button.primary{border-color:var(--blue);background:var(--blue);color:#fff}
.adoption-section{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px}.adoption-section p{max-width:720px;margin-top:4px;color:var(--muted);font-size:12px}.adoption-actions{display:flex;gap:7px;flex:none}.adoption-confirm{min-width:min(480px,100%);padding:11px;border:1px solid var(--warn-line);border-radius:10px;background:var(--warn-soft)}.adoption-confirm p{margin:0;color:var(--warn-txt);line-height:1.55}.adoption-confirm-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}.adoption-section button{min-height:40px;padding:7px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--muted);font-size:12px}.adoption-section button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.adoption-section button:disabled{opacity:.42;cursor:not-allowed}
.comparison-details{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.comparison-details>summary{min-height:42px;display:flex;align-items:center;padding:8px 11px;color:var(--blue);font-size:12px;cursor:pointer;list-style:none}
.comparison-details>summary span{margin-left:auto;padding:2px 7px;border-radius:999px;background:var(--blue-soft)}
.comparison-details>div{display:grid;gap:7px;padding:0 10px 10px}
.comparison-details article{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--well)}
.comparison-case-index{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#fff;color:var(--blue);font-size:11px}
.comparison-details h3{font-size:12.5px}.comparison-details p{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}
.comparison-details details{margin-top:6px}.comparison-details details summary{color:var(--blue);font-size:12px;cursor:pointer}
.comparison-details code{display:block;margin-top:5px;padding:6px;border-radius:6px;background:#fff;color:var(--sub);font:11px/1.45 ui-monospace,"SF Mono",Menlo,monospace;overflow-wrap:anywhere}
.adoption-observation{max-width:1000px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;margin:0 auto 12px;padding:14px 16px}
.adoption-observation>div>span{color:var(--blue);font-size:12px}.adoption-observation h2{margin-top:2px;font-size:15px}.adoption-observation p{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}
.adoption-observation-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.adoption-observation-actions button{min-height:40px;padding:7px 10px;border:1px solid var(--blue-line);border-radius:9px;background:#fff;color:var(--blue);font-size:12px}.adoption-observation-actions button:disabled{opacity:.45}
.adoption-observation>details{grid-column:1/-1}.adoption-observation>details summary{color:var(--blue);font-size:12px;cursor:pointer}.adoption-observation>details code{display:block;margin-top:5px;padding:6px;border-radius:6px;background:var(--well);font:11px/1.45 ui-monospace,"SF Mono",Menlo,monospace;overflow-wrap:anywhere}

/* ===== 能力星图：模块居中，能力环绕，组件按需展开 ===== */
.spatial-workbench{max-width:1040px;margin:0 auto}
.spatial-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:6px}
.spatial-head .page-head{margin:0;min-width:0}
.term-guide{margin:10px 0 0;border:1px solid var(--line);border-radius:11px;background:#fff}
.term-guide summary{min-height:40px;display:flex;align-items:center;padding:7px 12px;color:var(--muted);font-size:11.5px;cursor:pointer;list-style:none}
.term-guide summary::after{content:"展开";margin-left:auto;color:var(--faint);font-size:10px}
.term-guide[open] summary::after{content:"收起"}
.term-guide>div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 10px 10px}
.term-guide span{padding:8px 9px;border-radius:8px;background:var(--well);color:var(--muted);font-size:10.5px;line-height:1.45}
.term-guide b{display:block;color:var(--txt);font-size:11px;margin-bottom:2px}
.module-dock{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--sh-sm);flex:none}
.module-dock button{min-width:70px;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:13px;transition:.16s;white-space:nowrap}
.module-dock button span{font-size:13px}
.module-dock button b{font-size:11.5px;font-weight:600}
.module-dock button:hover{background:var(--well);color:var(--txt)}
.module-dock button.on{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-line)}
.capability-orbit{position:relative;height:430px;margin-top:16px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,rgba(219,234,254,.78) 0,rgba(239,246,255,.44) 24%,rgba(255,255,255,.78) 55%,#fff 78%);
  box-shadow:var(--sh-sm)}
.capability-orbit::before{content:"";position:absolute;left:50%;top:50%;width:570px;height:290px;transform:translate(-50%,-50%);border:1px dashed rgba(37,99,235,.18);border-radius:50%;pointer-events:none}
.capability-orbit::after{content:"";position:absolute;inset:22px;border-radius:18px;background-image:radial-gradient(rgba(37,99,235,.12) .8px,transparent .8px);background-size:18px 18px;mask-image:radial-gradient(circle at center,transparent 10%,#000 78%);pointer-events:none}
.module-core{position:absolute;left:50%;top:50%;z-index:3;width:214px;min-height:148px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border:1px solid rgba(37,99,235,.28);border-radius:26px;background:rgba(255,255,255,.96);box-shadow:0 18px 50px rgba(37,99,235,.14),inset 0 0 0 7px rgba(239,246,255,.75)}
.module-core .mc-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:17px;margin-bottom:7px}
.module-core h2{font-size:21px;line-height:1.2}
.module-core p{font-size:12px;color:var(--muted);margin-top:6px;max-width:160px}
.module-core small{font-size:10.5px;color:var(--blue);margin-top:8px}
.orbit-nodes{position:absolute;inset:0;z-index:4}
.ability-orbit-node{position:absolute;left:var(--x);top:var(--y);width:190px;min-height:74px;transform:translate(-50%,-50%);padding:11px 13px;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 5px 18px rgba(15,23,42,.06);text-align:left;color:var(--sub);transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.ability-orbit-node:hover{transform:translate(-50%,-50%) scale(1.025);border-color:var(--blue-line);box-shadow:0 10px 28px rgba(37,99,235,.12)}
.ability-orbit-node.on{border-color:var(--blue);background:#fff;box-shadow:0 10px 30px rgba(37,99,235,.16),0 0 0 4px rgba(37,99,235,.08)}
.ability-orbit-node b{display:block;color:var(--txt);font-size:13.5px;line-height:1.35;padding-right:34px}
.ability-orbit-node p{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}
.ability-orbit-node .ao-count{position:absolute;right:11px;top:11px;font-size:10px;color:var(--faint)}
.ability-orbit-node.on .ao-count{color:var(--blue)}
.orbit-hint{position:absolute;left:50%;bottom:18px;z-index:4;transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap}
.component-unfold{margin-top:16px;scroll-margin-top:78px}
.component-wait{padding:24px;border:1px dashed var(--line2);border-radius:16px;text-align:center;background:#fff;color:var(--muted);font-size:12.5px}
.component-wait b{display:block;color:var(--txt);font-size:14px;margin-bottom:2px}
.unfold-head{display:flex;align-items:center;gap:13px;padding:15px 17px;border:1px solid var(--blue-line);border-radius:16px 16px 0 0;background:linear-gradient(90deg,var(--blue-soft),#fff)}
.unfold-head .uh-mark{width:39px;height:39px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;color:var(--blue);font-size:15px;font-weight:650;box-shadow:var(--sh-sm);flex:none}
.unfold-head h2{font-size:16px;line-height:1.3}
.unfold-head p{font-size:11.5px;color:var(--muted);margin-top:3px}
.unfold-head .uh-count{margin-left:auto;align-self:flex-start;font-size:11px;color:var(--blue);white-space:nowrap}
.component-field{position:relative;padding:19px;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;background:
  linear-gradient(rgba(37,99,235,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.045) 1px,transparent 1px),#fbfdff;background-size:28px 28px;overflow:hidden}
.component-field::before{content:"";position:absolute;left:50%;top:-80px;width:520px;height:210px;transform:translateX(-50%);border:1px solid rgba(37,99,235,.12);border-radius:50%;pointer-events:none}
.component-net{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.component-tile{position:relative;min-height:112px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 4px 14px rgba(15,23,42,.045);text-align:left;color:var(--sub);transition:transform .16s,border-color .16s,box-shadow .16s}
.component-tile:nth-child(3n+2){transform:translateY(10px)}
.component-tile:hover{transform:translateY(-2px);border-color:var(--blue-line);box-shadow:0 9px 24px rgba(37,99,235,.1)}
.component-tile:nth-child(3n+2):hover{transform:translateY(7px)}
.component-tile .ct-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.component-tile .ct-type{font-size:9.5px;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 7px}
.component-tile .ct-state{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:auto}
.component-tile.off .ct-state{background:var(--weak)}
.component-tile.error{border-color:var(--warn-line);background:var(--warn-soft)}
.component-tile.error .ct-state{background:var(--warn)}
.component-tile .ct-status-label{font-size:10px;color:#047857;font-weight:600;white-space:nowrap}
.component-tile.off .ct-status-label{color:#475569}
.component-tile.error .ct-status-label{color:var(--warn-txt)}
.component-tile h3{font-size:13.5px;line-height:1.35;color:var(--txt)}
.component-tile p{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.component-more{position:relative;z-index:1;width:100%;margin-top:20px;border:1px dashed var(--blue-line);border-radius:11px;background:rgba(255,255,255,.86);padding:10px;color:var(--blue);font-size:12px}
.component-more:hover{background:#fff;border-style:solid}
.ao-state{display:inline-flex;margin-top:7px;padding:2px 7px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:9.5px;font-weight:600}
.component-empty{grid-column:1/-1;padding:26px 18px;border:1px dashed var(--line2);border-radius:12px;background:rgba(255,255,255,.78);text-align:center;color:var(--muted);font-size:12px}
.ability-utilities{position:relative;z-index:1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.ability-utilities button{min-height:38px;padding:7px 12px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--sub);font-size:11.5px}
.ability-utilities button:hover{border-color:var(--blue-line);color:var(--blue)}
.ability-advice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--warn-line);border-top:0;background:var(--warn-soft)}
.ability-advice>div{min-width:0}
.ability-advice b{display:block;font-size:12.5px;color:var(--txt)}
.ability-advice p{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.ability-advice small{display:block;font-size:10px;color:var(--warn-txt);margin-top:3px}
.ability-advice button{min-height:38px;padding:7px 11px;border:1px solid var(--warn-line);border-radius:9px;background:#fff;color:var(--warn-txt);font-size:11.5px;white-space:nowrap}
.confidence{display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
.confidence.high{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok-txt)}

/* ===== 运行数据建议 ===== */

.change-proposal ul{margin:6px 0 0 17px;color:var(--muted);font-size:12px;line-height:1.6}
.cp-actions,.cp-confirm{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:10px}
.cp-actions button,.cp-confirm button{min-height:40px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--sub);font-size:12px}
.cp-actions button.primary,.cp-confirm button.primary{border-color:var(--blue);background:var(--blue);color:#fff}
.cp-confirm{flex-wrap:wrap}
.cp-confirm p{width:100%;font-size:12px;color:var(--warn-txt)}
.cp-applied{display:flex;flex-direction:column;margin-top:10px;padding:9px 10px;border-radius:9px;background:var(--ok-soft);color:var(--ok-txt);font-size:12.5px}
.cp-applied span{font-size:12px;margin-top:2px}
.cp-applied.draft{background:var(--blue-soft);color:var(--blue)}
.cp-progress,.cp-unknown{display:flex;flex-direction:column;margin-top:10px;padding:9px 10px;border-radius:9px;font-size:12.5px}
.cp-progress{background:var(--blue-soft);color:var(--blue)}
.cp-unknown{background:var(--warn-soft);color:var(--warn-txt)}
.cp-progress span,.cp-unknown span{font-size:12px;margin-top:2px}

/* ===== 三级工作台 ===== */
.route-row{
  display:grid;grid-template-columns:170px 210px 1fr;gap:14px;align-items:center;
  padding:15px 17px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;
  background:#fff;box-shadow:var(--sh-sm);
}
.route-row .rr-label{font-weight:600;font-size:14.5px}
.route-row .rr-desc{font-size:12px;color:var(--faint);margin-top:2px}
.route-row select{
  width:100%;background:#fff;border:1px solid var(--line2);color:var(--sub);
  border-radius:8px;padding:8px 10px;font-size:13px;outline:none;transition:.15s;
}
.route-row select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.q-badges{display:flex;gap:7px;flex-wrap:wrap}
.q-badge{font-size:11.5px;padding:3px 9px;border-radius:7px;background:var(--well);border:1px solid var(--line);color:var(--muted)}
.q-badge b{color:var(--txt);font-weight:600;margin-left:4px}
details.adv{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh-sm)}
details.adv summary{
  cursor:pointer;padding:13px 17px;font-size:13px;color:var(--muted);list-style:none;
  display:flex;align-items:center;gap:8px;user-select:none;
}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸";color:var(--faint);transition:.18s}
details.adv[open] summary::before{transform:rotate(90deg)}
details.adv summary:hover{color:var(--blue)}
.adv-body{padding:2px 17px 17px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.adv-field label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px;letter-spacing:.6px;text-transform:uppercase}
.adv-field input{
  width:100%;background:#fff;border:1px solid var(--line2);color:var(--txt);
  border-radius:8px;padding:8px 10px;font-size:13px;outline:none;transition:.15s;
}
.adv-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

/* 工作流程工作台 */
.view-toggle{display:inline-flex;background:var(--well2);border-radius:10px;padding:3px;gap:2px}
.view-toggle button{border:none;background:transparent;color:var(--muted);padding:6px 16px;border-radius:8px;font-size:13px;transition:.15s}
.view-toggle button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:var(--sh-sm)}
.flow-layout{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.stage-item{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:#fff;overflow:hidden;box-shadow:var(--sh-sm)}
.stage-item.new{border-color:var(--ok-line)}
.stage-bar{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;transition:.15s}
.stage-bar:hover{background:var(--panel2)}
.stage-no{width:26px;height:26px;border-radius:50%;background:var(--well);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--blue);flex:none;font-family:ui-monospace,Menlo,monospace;font-weight:600}
.stage-item.new .stage-no{border-color:var(--ok-line);color:var(--ok-txt);background:var(--ok-soft)}
.stage-name{font-weight:600;font-size:13.5px}
.stage-arrow{color:var(--faint);margin-left:auto;font-size:12px}
.stage-detail{padding:2px 16px 14px 53px;font-size:12.5px;display:grid;gap:7px;color:var(--sub)}
.stage-detail .kv{display:grid;grid-template-columns:74px 1fr;gap:8px}
.stage-detail .kv b{color:var(--faint);font-weight:500}
.para-card{padding:14px 15px;border:1px solid var(--line);border-radius:10px;margin-bottom:11px;background:#fff;box-shadow:var(--sh-sm)}
.para-card .p-name{font-weight:600;display:flex;align-items:center;gap:8px;font-size:13.5px}
.para-card .p-row{font-size:12px;color:var(--muted);margin-top:6px}
.para-card .p-row b{color:var(--faint);font-weight:500}
.para-card .btn{margin-top:10px;width:100%;padding:7px}
.pro-canvas{border:1px solid var(--line);border-radius:var(--r);background:
  radial-gradient(circle at 1px 1px, rgba(100,116,139,.16) 1px, transparent 0) 0 0/24px 24px,
  #fff;padding:10px;overflow-x:auto;box-shadow:var(--sh-sm)}

/* ===== 效果测试 ===== */
.trial-tabs{display:inline-flex;background:var(--well2);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px}
.trial-tabs button{border:none;background:transparent;color:var(--muted);padding:7px 20px;border-radius:8px;font-size:13.5px;transition:.15s}
.trial-tabs button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:var(--sh-sm)}
.try-layout{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.chat-panel{padding:18px;min-height:480px;display:flex;flex-direction:column}
.msg{display:flex;gap:10px;margin-bottom:18px}
.msg .av{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.msg.user .av{background:var(--well2);color:var(--muted)}
.msg.agent .av{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.msg .bubble{max-width:88%;padding:11px 14px;border-radius:12px;font-size:13.5px;color:var(--sub)}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--blue-soft);border:1px solid rgba(37,99,235,.16);border-top-right-radius:4px}
.msg.agent .bubble{background:var(--well);border:1px solid var(--line);border-top-left-radius:4px}
.msg .b-build{font-size:11px;color:var(--faint);margin-top:8px;font-family:ui-monospace,Menlo,monospace}
.msg .b-src{margin-top:9px;padding:8px 10px;border-left:2px solid var(--ok);background:var(--ok-soft);border-radius:0 8px 8px 0;font-size:12px;color:var(--muted)}
.msg .b-src li{margin-left:16px}
.msg ul.ans{margin:6px 0 0 18px}
.msg ul.ans li{margin-bottom:5px}
.ev-panel{padding:16px}
.ev-panel h4{font-size:13px;color:var(--muted);letter-spacing:.4px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:600}
.ev-sec{margin-bottom:14px}
.ev-sec .ev-t{font-size:11px;color:var(--faint);letter-spacing:.8px;margin-bottom:6px;text-transform:uppercase}
.ev-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 10px;background:var(--well);border:1px solid var(--line);border-radius:7px;margin-bottom:5px;color:var(--sub)}
.ev-row .v{color:var(--blue);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.ev-row .v.ok{color:var(--ok-txt)}
.ev-note{font-size:11.5px;color:var(--faint);border-top:1px dashed var(--line2);padding-top:10px;margin-top:4px}

/* 调校 */
.tune-layout{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.issue-card{padding:13px 15px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff;box-shadow:var(--sh-sm)}
.issue-card:hover{border-color:var(--line2)}
.issue-card.on{border-color:var(--blue-line);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.issue-card .i-t{font-weight:600;display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
.issue-card .i-d{font-size:12px;color:var(--muted);margin-top:6px}
.issue-ev{margin-top:9px;border-top:1px dashed var(--line2);padding-top:9px;font-size:12px}
.issue-ev .qa{padding:8px 10px;background:var(--well);border-radius:8px;margin-bottom:6px;border:1px solid var(--line);color:var(--sub)}
.issue-ev .qa b{display:block;font-size:11px;color:var(--faint);margin-bottom:2px;font-weight:500}
.diag-card{padding:15px 17px;border:1px solid var(--warn-line);border-radius:var(--r);background:var(--warn-soft);margin-bottom:14px}
.diag-card .d-t{font-size:11px;color:var(--warn-txt);letter-spacing:.8px;margin-bottom:8px;text-transform:uppercase;font-weight:600}
.diag-card .d-line{font-size:13px;margin-bottom:5px;color:var(--sub)}
.diag-card .d-line b{color:var(--txt)}
.plan-card{padding:14px 17px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;cursor:pointer;transition:.15s;background:#fff;box-shadow:var(--sh-sm)}
.plan-card:hover{border-color:var(--line2)}
.plan-card.on{border-color:var(--blue-line);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.plan-card .pl-t{font-weight:600;display:flex;align-items:center;gap:8px;font-size:13.5px}
.plan-kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:12.5px;margin-top:10px;color:var(--sub)}
.plan-kv b{color:var(--faint);font-weight:500}
.pipe{display:flex;align-items:center;margin:18px 0 4px;flex-wrap:wrap;row-gap:8px}
.pipe-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint)}
.pipe-step .p-dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.pipe-step.done{color:var(--ok-txt)}
.pipe-step.done .p-dot{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-txt)}
.pipe-step.now{color:var(--warn-txt);font-weight:600}
.pipe-step.now .p-dot{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn-txt);animation:breathe 2s infinite}
.pipe-line{width:40px;height:1px;background:var(--line2);margin:0 8px}
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
.cmp-table th,.cmp-table td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.cmp-table th{color:var(--faint);font-weight:500;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.cmp-table td{color:var(--sub)}
.cmp-table td .old{color:var(--muted)}
.cmp-table td .new{color:var(--ok-txt);font-weight:600}
.cmp-table td .new small{color:var(--faint);font-weight:400}
.regress-bar{height:8px;border-radius:99px;background:var(--well2);overflow:hidden;margin:14px 0 6px}
.regress-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#2563eb);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

/* Diff 弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:90;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s}
.modal{width:560px;max-width:92vw;max-height:86vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--sh-lg);animation:popIn .2s ease}
@keyframes popIn{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.diff-sec{margin-top:14px}
.diff-sec .ds-t{font-size:11px;color:var(--faint);letter-spacing:.8px;margin-bottom:7px;text-transform:uppercase;font-weight:600}
.diff-row{display:flex;gap:10px;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel2);color:var(--sub)}
.diff-row .dr-ico{flex:none;width:20px;text-align:center}
.diff-row.add{border-color:var(--ok-line);background:#fff}
.diff-row.keep{opacity:.75}

/* Draft 提示条 */
.draft-bar{
  position:fixed;right:26px;bottom:26px;z-index:70;display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:12px;border:1px solid var(--warn-line);
  background:#fff;box-shadow:var(--sh-lg);
  animation:popIn .22s ease;font-size:13px;color:var(--sub);
}
.draft-bar b{color:var(--warn-txt)}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  padding:10px 18px;border-radius:10px;font-size:13px;background:#fff;color:var(--sub);
  border:1px solid var(--line2);box-shadow:var(--sh-lg);
  animation:toastIn .22s ease;display:flex;align-items:center;gap:8px;max-width:70vw;
}
.toast.ok{border-color:var(--ok-line);color:var(--ok-txt)}
.toast.info{border-color:var(--blue-line);color:var(--blue)}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
